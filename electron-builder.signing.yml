# ─────────────────────────────────────────────────────────────────────
# 코드 서명용 electron-builder 설정 (Azure Trusted Signing)
#
# 이 파일은 electron-builder.yml 을 extends 로 상속해 win 블록에 서명 옵션만
# 덧붙인다. electron-builder 의 config 병합은 deepAssign(깊은 병합)이라
# 기존 target / artifactName / nsis 설정은 그대로 유지된다.
#
# 사용:
#   npm run dist:signed     # 서명 + 로컬 산출물(release/), publish 안 함
#   npm run dist:publish    # 서명 + GitHub Releases 업로드
#
# 자격 증명(AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET)은
# .env.local 에 두고, 위 스크립트가 dotenv-cli 로 주입한다.
#
# 동작: azureSignOptions 가 있으면 electron-builder 가 PowerShell 모듈
#   TrustedSigning(0.4.1) 을 CurrentUser 스코프로 자동 설치한 뒤
#   Invoke-TrustedSigning 으로 .exe 를 서명한다.
#   (최초 1회 PSGallery/인터넷 접근 필요. PowerShell 5.1+ 필요.)
#
# 발급/설정 절차 전체는 docs/CODE_SIGNING.md 참고.
# ─────────────────────────────────────────────────────────────────────
extends: ./electron-builder.yml

win:
  # publisherName 은 발급된 인증서 주체(CN)와 정확히 일치해야 한다.
  # electron-updater 가 이 이름으로 업데이트 서명을 검증(verifyUpdateCodeSignature)하므로
  # 한 번 정하면 이후 릴리스에서 바꾸지 말 것.
  publisherName: "REPLACE_WITH_CERT_SUBJECT_CN"   # 예: 개인 검증이면 본인 실명

  azureSignOptions:
    # 계정/프로파일을 생성한 Azure 리전에 맞는 엔드포인트로 변경
    # (예: East US → https://eus.codesigning.azure.net/,
    #      West US 2 → https://wus2.codesigning.azure.net/)
    endpoint: "https://eus.codesigning.azure.net/"
    codeSigningAccountName: "REPLACE_WITH_TRUSTED_SIGNING_ACCOUNT"
    certificateProfileName: "REPLACE_WITH_CERTIFICATE_PROFILE"
